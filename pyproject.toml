[project]
name = "fleetopt"
version = "0.1.0"
description = "Two-depot, two-van routing as a QUBO on a SUMO road network, with classical baselines"
requires-python = ">=3.10"
dependencies = ["numpy", "networkx"]

[project.optional-dependencies]
sumo = ["sumolib"]
dwave = ["dimod", "dwave-samplers"]
qiskit = ["qiskit"]
test = ["pytest", "matplotlib", "nbclient", "nbformat", "ipykernel"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: needs the SUMO network file and sumolib (deselect with -m \"not slow\")",
]
